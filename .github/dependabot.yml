# Keep Go dependencies and pinned GitHub Actions current. Security
# updates arrive independently via the repo's Dependabot alerts; these
# are routine version bumps.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Let a release sit for three days before we pick it up, so a
    # compromised or immediately-yanked version has time to surface.
    cooldown:
      default-days: 3
    commit-message:
      prefix: deps
      include: scope
    labels:
      - dependencies
      - go

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps(ci)
      include: scope
    labels:
      - dependencies
      - github-actions
    # init, autobuild and analyze are separate Dependabot dependencies
    # even though they ship from one repo on one version line. Bumped
    # individually they drift apart, and the action then aborts with
    # "Loaded a configuration file for version X, but running version Y".
    # Grouping forces the three into a single PR.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
